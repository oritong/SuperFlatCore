plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.spongepowered.mixin' version '0.7-SNAPSHOT'
}

version = '1.4.16-hotfix2'
group = 'com.oritong.superflatcore'
archivesBaseName = 'superflatcore'

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.20.1'

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                superflatcore { source sourceSets.main }
            }
        }
        server {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                superflatcore { source sourceSets.main }
            }
        }
    }
}

mixin {
    add sourceSets.main, 'superflatcore.refmap.json'
    config 'superflatcore.mixins.json'
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    maven { url = 'https://maven.minecraftforge.net/' }
    maven { url = "${projectDir}/local_maven" }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.2.0'
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    compileOnly files('local_maven/com/gregtechceu/gtceu/7.5.3/gtceu-7.5.3.jar')
    compileOnly files('local_maven/top/ialdaiaxiariyay/bettergtae/1.2.2/bettergtae-1.2.2.jar')
    compileOnly files('local_maven/com/glodblock/github/expatternprovider/1.4.12/ExtendedAE-1.20-1.4.12-forge.jar')
    compileOnly files('local_maven/com/almostreliable/merequester/1.2.1/merequester-forge-1.20.1-1.2.1.jar')
    compileOnly files('local_maven/de/maxhenkel/pipez/1.2.26/pipez-forge-1.20.1-1.2.26.jar')
    compileOnly files('local_maven/cn/elytra/gtmqol/0.0.7.1-st/gtmqol-0.0.7.1-st.jar')
    compileOnly files('local_maven/slimeknights/tconstruct/3.11.2.166/TConstruct-1.20.1-3.11.2.166.jar')
    compileOnly files('local_maven/slimeknights/mantle/1.11.104/Mantle-1.20.1-1.11.104.jar')
    compileOnly files('local_maven/dev/arbor/gtnn/1.3.9/gtnn-1.20.1-1.3.9.jar')
    compileOnly files('local_maven/org/thedarkcolour/kotlinforforge/4.12.0/kotlinforforge-4.12.0-all.jar')
    compileOnly files('local_maven/com/portingdeadmods/cable_facades/2.1.3/cable_facades-1.20.1-Forge-2.1.3.jar')
    compileOnly files('local_maven/com/klikli_dev/occultism/1.158.0/occultism-1.20.1-1.158.0.jar')
    compileOnly files('local_maven/me/kall/ezunclear/1.0.2/ezunclear-1.20.1-1.0.2.jar')
    compileOnly files('local_maven/net/dragonegg/moreburners/0.3.5/moreburners-1.20.1-0.3.5.jar')
    compileOnly files('local_maven/com/hepdd/gtmthings/1.6.0/gtmthings-1.6.0.jar')
    compileOnly files('local_maven/snownee/jade/11.13.1/jade-1.20.1-Forge-11.13.1.jar')
    compileOnly files('local_maven/com/buuz135/industrialforegoing/3.5.21/industrialforegoing-1.20.1-3.5.21.jar')
