}

jar {
    manifest {
        attributes([
            "Specification-Title"     : "superflatcore",
            "Specification-Vendor"    : "oritong(use ChatGPT)",
            "Specification-Version"   : "1",
            "Implementation-Title"    : project.name,
            "Implementation-Version"  : project.jar.archiveVersion,
            "Implementation-Vendor"   : "oritong(use ChatGPT)",
            "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
            "MixinConfigs"            : "superflatcore.mixins.json"
        ])
    }
}

jar.finalizedBy('reobfJar')

tasks.register('verifyToolAssemblyRecipes', JavaExec) {
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.oritong.superflatcore.recipe.ToolAssemblyPatternTest'
}

tasks.named('check') { dependsOn tasks.named('verifyToolAssemblyRecipes') }

tasks.register('verifyComponentAssemblyRecipes', JavaExec) {
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.oritong.superflatcore.recipe.ComponentAssemblyRecipeRulesTest'
}

tasks.named('check') { dependsOn tasks.named('verifyComponentAssemblyRecipes') }

tasks.register('verifyBlackHoleMatrices', JavaExec) {
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.oritong.superflatcore.blackhole.client.BlackHoleMatricesTest'
}

tasks.named('check') { dependsOn tasks.named('verifyBlackHoleMatrices') }

publishing {
    publications {
        register('mavenJava', MavenPublication) { artifact jar }
    }
    repositories {
        maven { url "file://${project.projectDir}/mcmodsrepo" }
    }
}
